name: Build Flet iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Initialize Flet Mobile Project
        run: |
          flet create . --project-name flet_ping_network --force

      - name: Build iOS IPA
        run: |
          flet build ipa --no-codesign --verbose

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-ping-ios-ipa
          path: build/ios/ipa/*.ipa
